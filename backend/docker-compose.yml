services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kaema
      POSTGRES_USER: kaema
      POSTGRES_PASSWORD: kaema
    ports:
      - "5432:5432"
    volumes:
      - kaema-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kaema -d kaema"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  kaema-postgres:
